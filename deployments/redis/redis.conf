# Redis configuration for SMTP Outbound Daemon

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Security
# requirepass your_password_here  # Enable in production

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append only file (more durable)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
