# SMTP Edge Proxy Configuration Example

# Listener configuration
listeners:
  submission: ":587"  # STARTTLS port
  smtps: ":465"       # Implicit TLS port

# TLS configuration
tls:
  min_version: "1.2"  # Minimum TLS version: 1.0, 1.1, 1.2, 1.3
  certs_dir: "certs"  # Directory containing .pem certificate files
  cipher_suites: []   # Empty = use Go defaults
  prefer_server_cipher: true

# Backend authentication server configuration
backend:
  host: "172.23.20.40"      # Backend SMTP server for authentication
  port: 587                  # Backend port
  use_starttls: true         # Use STARTTLS
  implicit_tls: false        # Use implicit TLS
  skip_tls_verify: false     # Skip TLS certificate verification
  timeout: 10s               # Connection timeout

# Relay backend configuration
relay:
  host: "172.23.20.40"       # Backend SMTP server for relaying
  port: 25                    # Backend port
  use_starttls: false         # Use STARTTLS
  implicit_tls: false         # Use implicit TLS
  skip_tls_verify: false      # Skip TLS certificate verification
  timeout: 30s                # Connection timeout
  pool_enabled: false         # Enable connection pooling
  pool_max_idle: 10           # Max idle connections in pool
  pool_max_active: 100        # Max active connections in pool

# SMTP server configuration
smtp:
  banner_hostname: "edge-smtp.intesys.io"
  require_tls: true           # Require TLS before AUTH
  allow_insecure_auth: false  # Allow AUTH without TLS

  # SMTP capabilities
  capabilities:
    pipelining: true
    size: true
    size_limit: 150000000     # 150MB
    enhanced_status_codes: true
    eight_bit_mime: true
    dsn: true
    chunking: true
    smtputf8: true
    binary_mime: true

# Security configuration
security:
  ip_allow_list: []           # IP addresses/CIDRs allowed (empty = all)
  ip_deny_list: []            # IP addresses/CIDRs denied
  rate_limit_enabled: true
  rate_limit_per_ip: 10       # Failed auth attempts per IP
  rate_limit_per_user: 100    # Failed auth attempts per user
  rate_limit_window: 1m       # Rate limit window
  arc_enabled: false          # Enable ARC/DMARC helper headers

# Connection limits
limits:
  max_recipients: 200         # Max recipients per message
  max_connections: 1000       # Max total connections
  max_connections_per_ip: 10  # Max connections per IP
  read_timeout: 120s          # Read timeout
  write_timeout: 120s         # Write timeout
  idle_timeout: 300s          # Idle timeout

# Observability configuration
observability:
  log_level: "info"           # debug, info, warn, error
  log_format: "json"          # json or text
  metrics_enabled: true
  metrics_addr: ":9090"       # Prometheus metrics endpoint
  health_addr: ":8080"        # Health check endpoint
  tracing_enabled: false
  tracing_endpoint: ""        # OpenTelemetry collector endpoint
  tracing_service_name: "smtp-edge-proxy"
